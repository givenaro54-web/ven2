<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MQTT WebSocket Dashboard</title>

    <!-- Paho MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .card-content {
            padding: 15px;
            display: none;
        }

        .card-content.active {
            display: block;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 15px;
            background: var(--danger);
            color: white;
            text-align: center;
        }

        #messages {
            background: #111;
            color: #0f0;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>MQTT WebSocket Dashboard</h2>

        <!-- STATUS -->
        <div id="status">Not Connected</div>

        <!-- MQTT CONFIG -->
        <div class="card">
            <div class="card-header">MQTT Config</div>

            <div class="card-content active">

                <select id="protocol">
                    <option value="wss">wss</option>
                    <option value="ws">ws</option>
                </select>

                <input id="broker" value="broker.emqx.io" />

                <input id="port" value="8084" />

                <input id="path" value="/mqtt" />

                <button id="connectBtn">Connect</button>

            </div>
        </div>

        <!-- SUBSCRIBE -->
        <div class="card">
            <div class="card-header">Subscribe</div>

            <div class="card-content">

                <input id="subtopic" placeholder="example/topic" />

                <button id="subscribeBtn">Subscribe</button>

            </div>
        </div>

        <!-- PUBLISH -->
        <div class="card">
            <div class="card-header">Publish</div>

            <div class="card-content">

                <input id="pubtopic" placeholder="example/topic" />

                <input id="message" placeholder="hello mqtt" />

                <button id="publishBtn">Send</button>

            </div>
        </div>

        <!-- MESSAGE -->
        <div class="card">
            <div class="card-header">Messages</div>

            <div class="card-content active">
                <div id="messages">Waiting data...</div>
            </div>
        </div>

    </div>

    <script>
        // Shortcut
        const $ = (id) => document.getElementById(id);

        let client = null;
        let connected = false;

        // Toggle Card
        document.querySelectorAll(".card-header").forEach((header) => {
            header.addEventListener("click", () => {
                header.nextElementSibling.classList.toggle("active");
            });
        });

        // Log Message
        function log(text) {
            const msgBox = $("messages");
            const time = new Date().toLocaleTimeString();

            msgBox.innerHTML += `[${time}] ${text}\n`;
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        // Status
        function setStatus(text, type) {
            const status = $("status");

            status.textContent = text;

            status.style.background =
                type === "success"
                    ? "var(--success)"
                    : type === "danger"
                    ? "var(--danger)"
                    : "var(--primary)";
        }

        // CONNECT
        $("connectBtn").addEventListener("click", () => {

            const protocol = $("protocol").value;
            const broker = $("broker").value;
            const port = parseInt($("port").value);
            const path = $("path").value;

            const clientID =
                "web_" + Math.random().toString(16).substr(2, 8);

            // MQTT Client
            client = new Paho.MQTT.Client(
                broker,
                port,
                path,
                clientID
            );

            // Connection Lost
            client.onConnectionLost = () => {
                connected = false;

                setStatus("Connection Lost", "danger");
                log("Connection lost");
            };

            // Message Arrived
            client.onMessageArrived = (message) => {
                log(
                    `Topic: ${message.destinationName} | ${message.payloadString}`
                );
            };

            // Connect
            client.connect({
                useSSL: protocol === "wss",
                timeout: 5,

                onSuccess: () => {
                    connected = true;

                    setStatus(
                        `Connected to ${broker}`,
                        "success"
                    );

                    log("Connected");
                },

                onFailure: (err) => {
                    setStatus("Connection Failed", "danger");

                    log("Failed: " + err.errorMessage);
                }
            });
        });

        // SUBSCRIBE
        $("subscribeBtn").addEventListener("click", () => {

            if (!connected) {
                alert("Not connected");
                return;
            }

            const topic = $("subtopic").value;

            client.subscribe(topic);

            log("Subscribed: " + topic);
        });

        // PUBLISH
        $("publishBtn").addEventListener("click", () => {

            if (!connected) {
                alert("Not connected");
                return;
            }

            const topic = $("pubtopic").value;
            const msg = $("message").value;

            const message = new Paho.MQTT.Message(msg);

            message.destinationName = topic;

            client.send(message);

            log("Sent: " + msg);
        });
    </script>

</body>
</html>
